{% extends 'base.html' %}
{% load static %}

{% block content %}
<script>
    sessionStorage.removeItem('detection_configuration_incomplete');
</script>

<div class="container mt-5">
    <h2>Configurar Detección de Mesas</h2>
    <div class="row">
        <div class="col-md-4 mb-3">
            <h3>Seleccionar Cámara</h3>
            <select id="camera-select" class="form-select">
                <option value="">Seleccione una cámara</option>
                {% for camara in camaras %}
                    <option value="{{ camara.ip_url }}">{{ camara.ambiente }} - Piso {{ camara.piso }} - {{ camara.label }}</option>
                {% endfor %}
            </select>
            <button id="start-detection" class="btn btn-primary mt-2">Iniciar Detección</button>
            <div id="detection-alert" class="alert alert-info mt-2" style="display: none;" role="alert">
                </div>
        </div>
        <div class="col-md-8">
            <div id="video-container" style="display: none; position: relative; width: 640px; height: 480px;">
                <img id="video-stream" src="" alt="Video stream" style="width: 640px; height: 480px;">
                <canvas id="polygon-canvas" width="640" height="480" style="position: absolute; top: 0; left: 0;"></canvas>
            </div>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-md-12">
            <h3>Polígonos Detectados</h3>
            <table class="table" id="table-polygons">
                <thead>
                    <tr>
                        <th>Color</th>  <th>ID</th>
                        <th>Etiqueta</th>
                        <th>Área (m²)</th>
                        <th>Perímetro (m)</th>
                        <th>Máx. Personas</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
            <button id="add-polygon-btn" class="btn btn-primary mt-3">Agregar Polígono</button>
            <div class="mt-3">
                <label for="detection-interval">Intervalo de detección (1-60 seg):</label>
                <input type="number" id="detection-interval" class="form-control" min="1" max="60" value="5">
            </div>
            <button id="start-tracking-btn" class="btn btn-success mt-3">Guardar Polígonos e Iniciar Detección</button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const cameraSelect = document.getElementById('camera-select');
    const startDetectionBtn = document.getElementById('start-detection');
    const videoContainer = document.getElementById('video-container');
    const videoStream = document.getElementById('video-stream');
    const polygonCanvas = document.getElementById('polygon-canvas');
    const ctx = polygonCanvas.getContext('2d');
    const addPolygonBtn = document.getElementById('add-polygon-btn');
    const tablePolygons = document.getElementById('table-polygons');
    const detectionAlert = document.getElementById('detection-alert');

    let detections = [];
    let isDrawing = false;
    let newPolygon = [];
    let selectedPolygon = null;
    let selectedVertexIndex = null;
    let isDragging = false;

    function updatePolygonTable() {
    fetch('{% url "obtener_info_mesas" %}')
    .then(response => {
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
    })
    .then(data => {
        // Validación crucial agregada aquí:
        if (data.mesas && Array.isArray(data.mesas)) {
            detections = data.mesas;
        } else {
            detections = [];  // Si no hay datos, se asigna un arreglo vacío
        }
        const tableBody = document.querySelector('#table-polygons tbody');
        tableBody.innerHTML = '';

        detections.forEach(mesa => {
            const row = document.createElement('tr');

            // Celda de color
            const colorCell = document.createElement('td');
            const colorDiv = document.createElement('div');
            colorDiv.style.width = '20px';
            colorDiv.style.height = '20px';
            colorDiv.style.backgroundColor = `rgb(${mesa.color.join(',')})`;
            colorCell.appendChild(colorDiv);
            row.appendChild(colorCell);

            // Celda de ID
            const idCell = document.createElement('td');
            idCell.textContent = mesa.id;
            row.appendChild(idCell);

            // Celda de etiqueta
            const labelCell = document.createElement('td');
            const labelInput = document.createElement('input');
            labelInput.type = 'text';
            labelInput.classList.add('form-control', 'label-input');
            labelInput.value = mesa.label;
            labelInput.dataset.id = mesa.id;
            labelCell.appendChild(labelInput);
            row.appendChild(labelCell);

            // Celdas de área, perímetro y máximo de personas
            const areaCell = document.createElement('td');
            areaCell.textContent = mesa.area.toFixed(2);
            row.appendChild(areaCell);

            const perimeterCell = document.createElement('td');
            perimeterCell.textContent = mesa.perimeter.toFixed(2);
            row.appendChild(perimeterCell);

            const maxPersonasCell = document.createElement('td');
            const maxPersonasInput = document.createElement('input');
            maxPersonasInput.type = 'number';
            maxPersonasInput.classList.add('form-control', 'max-personas-input');
            maxPersonasInput.value = mesa.max_personas;
            maxPersonasInput.dataset.id = mesa.id;
            maxPersonasCell.appendChild(maxPersonasInput);
            row.appendChild(maxPersonasCell);

            // Celda de acciones
            const actionsCell = document.createElement('td');
            const removeButton = document.createElement('button');
            removeButton.classList.add('btn', 'btn-sm', 'btn-danger', 'remove-polygon-btn');
            removeButton.textContent = 'Quitar';
            removeButton.dataset.id = mesa.id;
            actionsCell.appendChild(removeButton);
            row.appendChild(actionsCell);

            tableBody.appendChild(row);
        });

        addEditableInputListeners();
        drawPolygons();
    })
    .catch(error => {
        console.error("Error en updatePolygonTable:", error);
        alert('Error al cargar la tabla: ' + error.message);
    });
}

function addEditableInputListeners() {
    document.querySelectorAll('.label-input').forEach(input => {
        input.addEventListener('change', function(e) {
            const polygonId = e.target.dataset.id;
            const newLabel = e.target.value;
            console.log("Cambiando etiqueta. ID:", polygonId, "Nuevo valor:", newLabel); // LOG
            updatePolygonField(polygonId, 'label', newLabel);
        });
    });

    document.querySelectorAll('.max-personas-input').forEach(input => {
        input.addEventListener('change', function(e) {
            const polygonId = e.target.dataset.id;
            const newMaxPersonas = parseInt(e.target.value, 10);
            console.log("Cambiando max_personas. ID:", polygonId, "Nuevo valor:", newMaxPersonas); // LOG
            if (!isNaN(newMaxPersonas)) {
                updatePolygonField(polygonId, 'max_personas', newMaxPersonas);
            }
        });
    });
}



function updatePolygonField(polygonId, field, newValue) {
    console.log(`Enviando: polygon_id=${polygonId}, field=${field}, value=${newValue}`); // LOG

    fetch('{% url "actualizar_campo_poligono" %}', {
        method: 'POST',
        headers: {
            'X-CSRFToken': '{{ csrf_token }}',
            'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: `polygon_id=${polygonId}&field=${field}&value=${newValue}`
    })
    .then(response => {
        console.log("Respuesta recibida:", response);  // LOG
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
    })
    .then(data => {
        console.log("Datos recibidos:", data); // LOG
        if (data.success) {
          console.log("Actualización exitosa en el backend.");
            // Actualizamos la lista 'detections' *localmente*
            detections = detections.map(polygon => {
                if (polygon.id === polygonId) {
                    // Actualizar el campo específico
                    return { ...polygon, [field]: newValue };
                }
                return polygon;
            });
            // *Después* de actualizar la lista local, redibujamos la tabla.
            updatePolygonTable();

        } else {
            console.error("Error reportado por el backend:", data.error);
            alert(data.error);
        }
    })
    .catch(error => {
        console.error("Error en updatePolygonField:", error);
        alert('Error al actualizar el campo: ' + error.message);
    });
}


    startDetectionBtn.addEventListener('click', function() {
        const selectedCamera = cameraSelect.value;
        if (!selectedCamera) {
            alert('Por favor, seleccione una cámara');
            return;
        }

        startDetectionBtn.disabled = true;
        detectionAlert.style.display = 'block';
        detectionAlert.textContent = 'Iniciando detección de mesas...';

        fetch('{% url "iniciar_deteccion" %}', {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `ip_url=${selectedCamera}`
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                videoStream.src = '{% url "stream_video" %}';
                videoContainer.style.display = 'block';
                detectionAlert.textContent = 'Detectando mesas...';
                fetch('{% url "detectar_mesas" %}', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}',
                        'Content-Type': 'application/json',
                    }
                })
                .then(response => response.json())
                .then(data => {
                    startDetectionBtn.disabled = false;
                    if (data.success) {
                        detections = data.detections;
                        updatePolygonTable(); // Actualiza la tabla *después* de la detección
                        detectionAlert.textContent = 'Detección completada.';
                    } else {
                        detectionAlert.textContent = `Error en la detección: ${data.error}`;
                    }
                });
            } else {
                startDetectionBtn.disabled = false;
                detectionAlert.textContent = `Error al iniciar: ${data.error}`;
            }
        })
        .catch(error => {
            startDetectionBtn.disabled = false;
            console.error('Error:', error);
            detectionAlert.textContent = 'Ocurrió un error al iniciar la detección';
        });
    });


    function drawPolygons() {
        ctx.clearRect(0, 0, polygonCanvas.width, polygonCanvas.height);

        // Solo dibujar polígonos de la sesión (detections).  Ya no necesitamos backendPolygons aquí.
        detections.forEach(detection => {
            ctx.beginPath();
            let points = detection.points;
            ctx.moveTo(points[0][0], points[0][1]);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i][0], points[i][1]);
            }
            ctx.closePath();
            ctx.strokeStyle = `rgb(${detection.color.join(',')})`;
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw vertices
            ctx.fillStyle = 'red';
            points.forEach((point, index) => {
                ctx.beginPath();
                ctx.arc(point[0], point[1], 5, 0, 2 * Math.PI);
                ctx.fill();
            });

            // Draw label
            ctx.fillStyle = 'black';
            ctx.font = '12px Arial';
            ctx.fillText(detection.label, points[0][0], points[0][1] - 10);
        });
    }


    videoStream.addEventListener('load', function() {
        polygonCanvas.width = videoStream.clientWidth;
        polygonCanvas.height = videoStream.clientHeight;
        drawPolygons();
    });


    addPolygonBtn.addEventListener('click', function() {
        isDrawing = true;
        newPolygon = [];
        alert('Haga clic en el canvas para agregar puntos. Haga doble clic para finalizar el polígono.');
    });

    polygonCanvas.addEventListener('click', function(e) {
        if (isDrawing) {
            const rect = polygonCanvas.getBoundingClientRect();
            const scaleX = polygonCanvas.width / rect.width;
            const scaleY = polygonCanvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            newPolygon.push([x, y]);
            drawNewPolygon();
        }
    });

    polygonCanvas.addEventListener('dblclick', function() {
        if (isDrawing && newPolygon.length > 2) {
            isDrawing = false;
            fetch('{% url "agregar_poligono" %}', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}',
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `points=${JSON.stringify(newPolygon)}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    detections.push(data.polygon);
                    updatePolygonTable(); // Actualiza la tabla *después* de agregar
                }
            });
        }
    });

    function drawNewPolygon() {
        drawPolygons();  // Redibujar *todos* los polígonos
        ctx.beginPath();
        ctx.moveTo(newPolygon[0][0], newPolygon[0][1]);
        for (let i = 1; i < newPolygon.length; i++) {
            ctx.lineTo(newPolygon[i][0], newPolygon[i][1]);
        }
        ctx.strokeStyle = 'yellow';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Draw vertices
        ctx.fillStyle = 'red';
        newPolygon.forEach((point, index) => {
            ctx.beginPath();
            ctx.arc(point[0], point[1], 5, 0, 2 * Math.PI);
            ctx.fill();
        });
    }

    polygonCanvas.addEventListener('mousedown', function(e) {
        const rect = polygonCanvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (polygonCanvas.width / rect.width);
        const y = (e.clientY - rect.top) * (polygonCanvas.height / rect.height);

        selectedPolygon = null;
        selectedVertexIndex = null;

        // Solo check session polygons (detections)
        detections.forEach(polygon => {
            polygon.points.forEach((point, index) => {
                const dx = point[0] - x;
                const dy = point[1] - y;
                if (Math.sqrt(dx * dx + dy * dy) < 5) {
                    selectedPolygon = polygon;
                    selectedVertexIndex = index;
                }
            });
        });

        if (selectedPolygon && selectedVertexIndex !== null) {
            isDragging = true;
        }
    });



    polygonCanvas.addEventListener('mousemove', function(e) {
        if (isDragging && selectedPolygon && selectedVertexIndex !== null) {
            const rect = polygonCanvas.getBoundingClientRect();
            const scaleX = polygonCanvas.width / rect.width;
            const scaleY = polygonCanvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            selectedPolygon.points[selectedVertexIndex] = [x, y];
            drawPolygons(); // Redibujar *solo* cuando se mueve un vértice
        }
    });

    polygonCanvas.addEventListener('mouseup', function(e) {
    if (isDragging && selectedPolygon) {
        if (!Array.isArray(selectedPolygon.points) || selectedPolygon.points.length === 0) {
            console.error("Error: selectedPolygon.points no es un array válido.", selectedPolygon.points);
            isDragging = false;
            selectedPolygon = null;
            selectedVertexIndex = null;
            return;
        }

        // Usar JSON.stringify y Content-Type: application/json
        fetch('{% url "actualizar_poligono" %}', {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json', // IMPORTANTE: JSON
            },
            body: JSON.stringify({ id: selectedPolygon.id, points: selectedPolygon.points }) // Enviar como JSON
        })
        .then(response => {
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            if (data.success) {
                // Actualizar la lista local *solo* si el backend confirma el éxito
                detections = detections.map(polygon => {
                    if (polygon.id === data.polygon.id) {
                        return data.polygon; // Usar datos del servidor
                    } else {
                        return polygon;
                    }
                });
              //  updatePolygonTable(); // <- Ya no es necesario. Se hace desde la modificacion de puntos
            } else {
                alert('Error al actualizar el polígono');
            }
        })
        .catch(error => {
            console.error("Error en la petición fetch:", error);
            alert('Error al actualizar el polígono: ' + error.message);
        });

        isDragging = false;
        selectedPolygon = null;
        selectedVertexIndex = null;
    }
});




    document.querySelector('#table-polygons').addEventListener('click', function(e) {
        if (e.target.classList.contains('remove-polygon-btn')) {
            const polygonId = e.target.dataset.id;
            if (confirm('¿Está seguro de que desea eliminar este polígono?')) {
                fetch('{% url "quitar_poligono" %}', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}',
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `polygon_id=${polygonId}`
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        updatePolygonTable(); // Actualiza la tabla *después* de eliminar
                    }
                });
            }
        }
    });


    document.getElementById('start-tracking-btn').addEventListener('click', function() {
        const detectionInterval = parseInt(document.getElementById('detection-interval').value, 10);
        if (isNaN(detectionInterval) || detectionInterval < 1 || detectionInterval > 60) {
            alert('El intervalo de detección debe ser un número entre 1 y 60.');
            return;
        }

      fetch('{% url "iniciar_tracking" %}', {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ 'polygons': detections, 'detection_interval': detectionInterval })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const cameraUuid = data.camera_uuid;
                document.querySelector('.container').innerHTML = `
<div class="text-center">
                        <h3>Configuración Completada</h3>
                        <div class="my-4">
                            <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
                        </div>
                        <p class="lead">La configuración de la cámara se ha completado con éxito.</p>
                        <div class="mt-4">
                            <a href="/monitoreo/supervisar-camara/${cameraUuid}" class="btn btn-primary">
                                <i class="bi bi-camera-video me-2"></i>Supervisar Cámara
                            </a>
                            <a href="{% url 'configurar_deteccion' %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left-circle me-2"></i>Volver a Configuración
                            </a>
                        </div>
                    </div>
                `;
            } else {
                alert(data.error);
            }
        });
    });

    window.addEventListener('resize', function() {
        polygonCanvas.width = videoStream.clientWidth;
        polygonCanvas.height = videoStream.clientHeight;
        drawPolygons();
    });
    updatePolygonTable(); //Llamada inicial para cargar datos
});
</script>

<script>
    window.addEventListener('beforeunload', function (e) {
        e.preventDefault();
        e.returnValue = 'Si sales ahora, perderás el progreso de la configuración.';
    });

    window.addEventListener('unload', function (e) {
        sessionStorage.setItem('detection_configuration_incomplete', 'true');
    });

    window.addEventListener('load', function (e) {
        if (sessionStorage.getItem('detection_configuration_incomplete') === 'true') {
            sessionStorage.removeItem('detection_configuration_incomplete');
            window.location.href = '{% url "configuracion" %}';
        }
    });
</script>
{% endblock %}
