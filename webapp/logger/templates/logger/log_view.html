<h1 class="my-4">Registros de Actividad</h1>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Fecha y Hora</th>
            <th>Usuario</th>
            <th>Acción</th>
            <th>Detalles</th>
            <th>Dirección IP</th>
        </tr>
    </thead>
    <tbody>
        {% for log in logs %}
        <tr>
            <td>{{ log.timestamp }}</td>
            <td>{{ log.user }}</td>
            <td>{{ log.action }}</td>
            <td>{{ log.details }}</td>
            <td>{{ log.ip_address }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
