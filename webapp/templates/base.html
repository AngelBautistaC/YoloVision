<!DOCTYPE html>
{% load static %}
{% load bootstrap5 %}
{% bootstrap_css %}
{% bootstrap_javascript %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="{% static 'images/favicon.png' %}"/>
    <title>VisionPUCP</title>
    
    <style>
        @font-face {
            font-family: 'TT_Bold';
            src: url('{% static "fonts/TT_Bold.otf" %}');
            font-weight: normal;
            font-style: normal;
        }
        body { 
            overflow-x: hidden;
            background-color: #E9E9E9;
        }
        #wrapper {
            display: flex;
            width: 100%;
            align-items: stretch;
        }
        #sidebar-wrapper {
            min-height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            transition: all 0.3s;
            background-color: #042354;
        }
        #sidebar-wrapper .sidebar-heading { 
            height: 110px;
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-heading img {
            height: 90px;
            width: auto;
        }
        #close-sidebar {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            margin-left: 10px;
        }
        #page-content-wrapper {
            width: 100%;
            min-height: 100vh;
            transition: all 0.3s;
        }
        .sidebar-nav { 
            padding-left: 0; 
            list-style: none; 
        }
        .sidebar-nav li { 
            padding: 10px 15px; 
        }
        .sidebar-nav li a { 
            text-decoration: none; 
            color: #cdcdcd; 
        }
        .sidebar-nav li.active { 
            background-color: rgba(255,255,255,0.1); 
        }
        .sidebar-nav li.active a { 
            color: white; 
        }
        .navbar {
    background-color: white !important;
    height: 70px;
    padding: 0 1rem;
}
.navbar-brand {
    font-family: 'TT_Bold';
    color: black !important;
    font-size: 1.5rem !important;
    line-height: 70px; /* Alinea verticalmente con la altura del navbar */
}
#menu-toggle {
    font-size: 1.25rem;
    padding: 0.5rem 0.75rem;
    display: flex;
    align-items: center;
    height: 70px; /* Iguala la altura del navbar */
}
#menu-toggle .navbar-toggler-icon {
    height: 1.5em;
    width: 1.5em;
}

@media (max-width: 768px) {

    #sidebar-wrapper {
        margin-left: -250px;
    }
    #sidebar-wrapper.active {
        margin-left: 0;
    }
    #page-content-wrapper {
        margin-left: 0;
    }
    .navbar-brand {
        font-size: 1.25rem !important;
    }
    #menu-toggle {
        font-size: 1rem;
        padding: 0.4rem 0.6rem;
    }
    #menu-toggle .navbar-toggler-icon {
        height: 1.25em;
        width: 1.25em;
    }
}
        @media (min-width: 769px) {
            #sidebar-wrapper {
                margin-left: 0;
            }
            #page-content-wrapper {
                margin-left: 250px;
            }
            #wrapper.toggled #sidebar-wrapper {
                margin-left: -250px;
            }
            #wrapper.toggled #page-content-wrapper {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div id="sidebar-wrapper">
            <div class="sidebar-heading">
                <img src="{% static 'images/cabeceraPUCP.png' %}" alt="PUCP Logo">
                <button id="close-sidebar">&times;</button>
            </div>
<ul class="sidebar-nav">
    <li class="{% if request.path == '/monitoreo/' %}active{% endif %}">
        <a href="/monitoreo"><i class="active"></i> Monitoreo</a>
    </li>
    <li class="{% if request.path == '/configuracion/' %}active{% endif %}">
        <a href="/configuracion"><i class="active"></i> Configuración</a>
    </li>
    <li class="{% if request.path == '/crear/' %}active{% endif %}">
        <a href="/crear"><i class="active"></i> Crear Usuarios</a>
    </li>
    <li class="{% if request.path == '/ayuda/' %}active{% endif %}">
        <a href="/ayuda"><i class="active"></i> Ayuda</a>
    </li>
    <li class="{% if request.path == '/logout/' %}active{% endif %}">
        <a href="/logout"><i class="active"></i> Cerrar Sesión</a>
    </li>
</ul>
        </div>
        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
                <div class="container-fluid">
                    <div class="d-flex align-items-center">
                        <button class="btn" id="menu-toggle">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <a class="navbar-brand mb-0 ms-3" href="#">{% block page_title %}Monitoreo{% endblock %}</a>
                    </div>
                    <div class="ms-auto me-3">
                        <!-- If needed, info on the right side corner of the navbar. -->
                    </div>
                </div>
            </nav>
            <div class="container-fluid">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById("wrapper").classList.toggle("toggled");
            document.getElementById("sidebar-wrapper").classList.toggle("active");
        }
    
        document.getElementById("menu-toggle").addEventListener("click", function(e) {
            e.preventDefault();
            toggleSidebar();
        });
    
        document.getElementById("close-sidebar").addEventListener("click", function(e) {
            e.preventDefault();
            toggleSidebar();
        });
        function handleOutsideClick(event) {
    var sidebar = document.getElementById('sidebar-wrapper');
    var toggleBtn = document.getElementById('menu-toggle');
    var wrapper = document.getElementById("wrapper");
    var isClickInside = sidebar.contains(event.target) || toggleBtn.contains(event.target);

    if (!isClickInside) {
        if (window.innerWidth <= 768) {
            // Lógica para dispositivos móviles
            if (sidebar.classList.contains('active')) {
                toggleSidebar();
            }
        } else {
            // Lógica para dispositivos de escritorio
            if (!wrapper.classList.contains("toggled")) {
                toggleSidebar();
            }
        }
    }
}

// Agregar event listeners para click y touch
document.addEventListener('click', handleOutsideClick);
document.addEventListener('touchstart', handleOutsideClick);
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
