{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <h2>Configurar Detección de Mesas</h2>
    <div class="row">
        <div class="col-md-4 mb-3">
            <h3>Seleccionar Cámara</h3>
            <select id="camera-select" class="form-select">
                <option value="">Seleccione una cámara</option>
                {% for camara in camaras %}
                    <option value="{{ camara.ip_url }}">{{ camara.ambiente }} - Piso {{ camara.piso }} - {{ camara.label }}</option>
                {% endfor %}
            </select>
            <button id="start-detection" class="btn btn-primary mt-2">Iniciar Detección</button>
        </div>
        <div class="col-md-8">
            <div id="video-container" style="display: none; position: relative;">
                <img id="video-stream" src="" alt="Video stream" style="width: 100%;">
                <canvas id="polygon-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></canvas>
            </div>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-md-12">
            <h3>Polígonos Detectados</h3>
            <table class="table" id="table-polygons">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Etiqueta</th>
                        <th>Área (m²)</th>
                        <th>Perímetro (m)</th>
                        <th>Máx. Personas</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Los polígonos se añadirán aquí dinámicamente -->
                </tbody>
            </table>
            <button id="add-polygon-btn" class="btn btn-primary mt-3">Agregar Polígono</button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

    




    const cameraSelect = document.getElementById('camera-select');
    const startDetectionBtn = document.getElementById('start-detection');
    const videoContainer = document.getElementById('video-container');
    const videoStream = document.getElementById('video-stream');
    const polygonCanvas = document.getElementById('polygon-canvas');
    const ctx = polygonCanvas.getContext('2d');
    const polygonList = document.getElementById('polygon-list');
    const addPolygonBtn = document.getElementById('add-polygon-btn');

    let detections = [];
    let isDrawing = false;
    let newPolygon = [];


    function updatePolygonTable() {
    fetch('{% url "obtener_info_mesas" %}')
    .then(response => response.json())
    .then(data => {
        const tableBody = document.querySelector('#table-polygons tbody');
        tableBody.innerHTML = '';
        data.mesas.forEach(mesa => {
            const row = `
                <tr>
                    <td>${mesa.id}</td>
                    <td>${mesa.label}</td>
                    <td>${mesa.area.toFixed(2)}</td>
                    <td>${mesa.perimeter.toFixed(2)}</td>
                    <td>${mesa.max_personas}</td>
                    <td>
                        <button class="btn btn-sm btn-info edit-label-btn" data-id="${mesa.id}">Editar</button>
                        <button class="btn btn-sm btn-danger remove-polygon-btn" data-id="${mesa.id}">Quitar</button>
                    </td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    });
}

// Llama a esta función cada segundo
setInterval(updatePolygonTable, 1000);

    startDetectionBtn.addEventListener('click', function() {
        const selectedCamera = cameraSelect.value;
        if (!selectedCamera) {
            alert('Por favor, seleccione una cámara');
            return;
        }

        fetch('{% url "iniciar_deteccion" %}', {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `ip_url=${selectedCamera}`
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                videoStream.src = '{% url "stream_video" %}';
                videoContainer.style.display = 'block';
                startPolygonDetection();
            } else {
                alert(data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Ocurrió un error al iniciar la detección');
        });
    });

    function startPolygonDetection() {
        setInterval(() => {
            fetch('{% url "obtener_detecciones" %}')
            .then(response => response.json())
            .then(data => {
                if (data.detections) {
                    detections = data.detections;
                    updatePolygonList();
                    drawPolygons();
                }
            });
        }, 1000); // Verificar cada segundo
    }

    function updatePolygonList() {
        polygonList.innerHTML = '';
        detections.forEach(detection => {
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = `
                <span>${detection.label}</span>
                <div>
                    <button class="btn btn-sm btn-info edit-label-btn" data-id="${detection.id}">Editar</button>
                    <button class="btn btn-sm btn-danger remove-polygon-btn" data-id="${detection.id}">Quitar</button>
                </div>
            `;
            polygonList.appendChild(li);
        });
    }

    function drawPolygons() {
        ctx.clearRect(0, 0, polygonCanvas.width, polygonCanvas.height);
        detections.forEach(detection => {
            ctx.beginPath();
            ctx.moveTo(detection.points[0][0], detection.points[0][1]);
            for (let i = 1; i < detection.points.length; i++) {
                ctx.lineTo(detection.points[i][0], detection.points[i][1]);
            }
            ctx.closePath();
            ctx.strokeStyle = `rgb(${detection.color.join(',')})`;
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = `rgb(${detection.color.join(',')})`;
            ctx.font = '12px Arial';
            ctx.fillText(detection.label, detection.points[0][0], detection.points[0][1] - 5);
        });
    }

    videoStream.addEventListener('load', function() {
        polygonCanvas.width = videoStream.width;
        polygonCanvas.height = videoStream.height;
    });

    addPolygonBtn.addEventListener('click', function() {
        isDrawing = true;
        newPolygon = [];
    });

    polygonCanvas.addEventListener('click', function(e) {
        if (isDrawing) {
            const rect = polygonCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            newPolygon.push([x, y]);
            
            if (newPolygon.length > 2) {
                ctx.beginPath();
                ctx.moveTo(newPolygon[0][0], newPolygon[0][1]);
                for (let i = 1; i < newPolygon.length; i++) {
                    ctx.lineTo(newPolygon[i][0], newPolygon[i][1]);
                }
                ctx.strokeStyle = 'yellow';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }
    });

    polygonCanvas.addEventListener('dblclick', function() {
        if (isDrawing && newPolygon.length > 2) {
            isDrawing = false;
            fetch('{% url "agregar_poligono" %}', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}',
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `points=${JSON.stringify(newPolygon)}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    detections.push(data.polygon);
                    updatePolygonList();
                    drawPolygons();
                }
            });
        }
    });

    document.querySelector('#table-polygons').addEventListener('click', function(e) {
    if (e.target.classList.contains('edit-label-btn')) {
        const polygonId = e.target.dataset.id;
        const newLabel = prompt('Ingrese el nuevo nombre para este polígono:');
        if (newLabel) {
            fetch('{% url "etiquetar_poligono" %}', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}',
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `polygon_id=${polygonId}&label=${newLabel}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    updatePolygonTable();
                }
            });
        }
    } else if (e.target.classList.contains('remove-polygon-btn')) {
        const polygonId = e.target.dataset.id;
        if (confirm('¿Está seguro de que desea eliminar este polígono?')) {
            fetch('{% url "quitar_poligono" %}', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}',
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `polygon_id=${polygonId}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    updatePolygonTable();
                }
            });
        }
    }
});



});
</script>
{% endblock %}
