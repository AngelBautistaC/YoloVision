{% extends 'base.html' %}
{% load static %}

{% block page_title %}Crear Usuario{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row mb-3">
        <div class="col-12">
            <h2>Crear Nuevo Usuario</h2>
        </div>
    </div>
    {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    <div class="row">
        <div class="col-12 col-md-8 offset-md-2">
            <form method="post" action="{% url 'crear_form' %}">
                {% csrf_token %}
                
                <!-- Username Field -->
                <div class="mb-3">
                    <label for="username" class="form-label">Nombre de usuario</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" class="form-control" id="username" name="username" required placeholder="Ingrese el nombre de usuario">
                    </div>
                </div>

                <!-- Email Field -->
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="Ingrese el correo electrónico">
                    </div>
                </div>

                <!-- Password Field -->
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Ingrese la contraseña">
                    </div>
                </div>

                <!-- Role Field -->
                <div class="mb-3">
                    <label for="role" class="form-label">Rol</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person-badge"></i>
                        </span>
                        <select class="form-select" id="role" name="role" required>
                            <option value="" disabled selected>Seleccione un rol</option>
                            <option value="user">Usuario</option>
                            <option value="operator">Operador</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="mb-3 text-end">
                    <button type="submit" class="btn btn-primary">Crear Usuario</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
<style>
    .input-group-text {
        background-color: #fff;
    }
    .form-label {
        font-weight: bold;
    }
</style>
{% endblock %}
